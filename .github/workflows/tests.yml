name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
        extras: ["dev", "dev,fast"]   # with and without the optional SciPy speed-up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"
      - name: Unit tests
        run: python -m pytest
      - name: CLI smoke test
        run: python -m mc_pricer --quick
